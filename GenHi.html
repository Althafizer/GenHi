// ─── STATS ───────────────────────────────────────────────
function AnimatedNumber({ target, suffix = '' }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      obs.disconnect();
      const num = parseFloat(target);
      const dur = 1800,steps = 60;
      let i = 0;
      const timer = setInterval(() => {
        i++;
        setVal((num * (i / steps)).toFixed(target.includes('.') ? 1 : 0));
        if (i >= steps) clearInterval(timer);
      }, dur / steps);
    }, { threshold: 0.5 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return <span ref={ref}>{val}{suffix}</span>;
}

          <div style={{ opacity: vis ? 1 : 0, transform: vis ? 'none' : 'translateX(30px)', transition: 'all 0.7s 0.2s ease' }}>
            <span style={{ background: '#dcfce7', color: '#166534', fontSize: '13px', fontWeight: '600', padding: '6px 16px', borderRadius: '20px', letterSpacing: '0.05em' }}>TENTANG KAMI</span>
            <h2 style={{ margin: '20px 0 20px', fontSize: 'clamp(28px,4vw,44px)', fontWeight: '800', color: '#0a1f0f', lineHeight: 1.2, fontFamily: "'DM Serif Display',serif" }}>
              Mengasosiasi Bank Sampah<br />
              <span style={{ color: tweaks.accentColor }}>Seluruh Yogyakarta</span>
            </h2>
            <p style={{ color: '#4b7c5e', fontSize: '16px', lineHeight: 1.8, marginBottom: '32px' }}>
              GenHi adalah organisasi yang mengasosiasi dan mendigitalkan puluhan bank sampah di Kota Yogyakarta.
              Setiap bank sampah memiliki spesialisasi tersendiri — dari plastik, logam, hingga minyak jelantah.
              Visi kami adalah menyadarkan masyarakat bahwa sampah bukan sekadar limbah, melainkan aset bernilai yang dapat diuangkan.
            </p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {pillars.map((p, i) =>
              <div key={i} style={{ display: 'flex', gap: '16px', alignItems: 'flex-start', padding: '16px', borderRadius: '16px', background: '#f8fdf9', border: '1px solid #e8f5ee', transition: 'box-shadow 0.2s' }}>
                  <div style={{ width: '44px', height: '44px', background: '#dcfce7', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '22px', flexShrink: 0 }}>{p.icon}</div>
                  <div>
                    <div style={{ fontWeight: '700', fontSize: '15px', color: '#0a1f0f', marginBottom: '4px' }}>{p.title}</div>
                    <div style={{ fontSize: '13px', color: '#6b9c7e', lineHeight: 1.6 }}>{p.desc}</div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </section>);

}

// ─── TWEAKS ──────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const inp = (key, type = 'text') => ({
    value: tweaks[key],
    onChange: (e) => {
      const v = type === 'checkbox' ? e.target.checked : e.target.value;
      setTweaks((t) => ({ ...t, [key]: v }));
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: v } }, '*');
    },
    type: type === 'checkbox' ? 'checkbox' : type,
    ...(type === 'checkbox' ? { checked: tweaks[key] } : {})
  });
  return (
    <div style={{ position: 'fixed', bottom: '24px', right: '24px', zIndex: 9999, background: '#fff', borderRadius: '20px', padding: '24px', boxShadow: '0 20px 60px rgba(0,0,0,0.15)', width: '280px', border: '1px solid #e8f5ee' }}>
      <div style={{ fontWeight: '800', fontSize: '14px', color: '#0a1f0f', marginBottom: '16px' }}>⚙️ Tweaks</div>
      {[
      { label: 'Hero Title', key: 'heroTitle', type: 'text' },
      { label: 'Accent Color', key: 'accentColor', type: 'color' },
      { label: 'Stat: Bank Sampah', key: 'statBanks', type: 'text' },
      { label: 'Stat: Ton Sampah', key: 'statSampah', type: 'text' },
      { label: 'Stat: Kecamatan', key: 'statKec', type: 'text' }].
      map((f) =>
      <div key={f.key} style={{ marginBottom: '12px' }}>
          <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', color: '#6b9c7e', marginBottom: '4px' }}>{f.label}</label>
          <input {...inp(f.key, f.type)} style={{ width: '100%', padding: '8px 12px', borderRadius: '8px', border: '1.5px solid #d1fae5', fontSize: '13px', outline: 'none', color: '#0a1f0f' }} />
        </div>
      )}
    </div>);

}

// ─── APP ─────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    const saved = localStorage.getItem('genhi_pos');
    if (saved) {const el = document.getElementById(saved);if (el) setTimeout(() => el.scrollIntoView(), 300);}
    window.addEventListener('scroll', () => {
      const sections = ['katalog', 'peta', 'artikel', 'daftar', 'kontak'];
      const cur = sections.find((id) => {const el = document.getElementById(id);if (!el) return false;const r = el.getBoundingClientRect();return r.top <= 100 && r.bottom > 100;});
      if (cur) localStorage.setItem('genhi_pos', cur);
    });
  }, []);

  return (
    <>
      <Navbar tweaks={tweaks} />
      <Hero tweaks={tweaks} />
      <StatsSection tweaks={tweaks} />
      <AboutSection tweaks={tweaks} />
      <window.CatalogSection />
      <window.MapSection />
      <window.ArticlesSection />
      <window.RegisterSection />
      <window.Footer />
      <BottomNav />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksOpen} />
    </>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
