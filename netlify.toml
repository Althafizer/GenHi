[build]
  publish = "."
  command = "echo 'Static site — no build needed'"

[build.environment]
  NODE_VERSION = "18"

# Netlify Identity — aktifkan Git Gateway
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Headers keamanan
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirect admin ke CMS
[[redirects]]
  from = "/cms"
  to = "/admin/"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/GenHi.html"
  status = 200
